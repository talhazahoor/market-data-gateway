name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so advisories published after the last commit still surface.
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Adds injection, path-traversal and SSRF queries beyond the default.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
